services:
  radiopaedia-connect:
    image: radiopaediaorg/radiopaedia-connect:latest
    container_name: radiopaedia-connect
    network_mode: host
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ./data/radiopaedia-connect:/data   # SQLite DB, downloaded DICOMs, data-protection keys
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - RCONNECT_SCP_PORT=4104
    restart: unless-stopped

  connect-configure:
    image: python:3.14-alpine
    profiles: ["configure"]
    network_mode: host
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    entrypoint: ["python", "-u", "-B", "/configure/configure_connect.py"]
    command:
      - --config
      - /configure/connect.json
      - --admin-password-file
      - /run/secrets/admin-password
    volumes:
      - type: bind
        source: ./scripts/configure_connect.py
        target: /configure/configure_connect.py
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./connect-config.json
        target: /configure/connect.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./secrets/connect
        target: /run/secrets
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      radiopaedia-connect:
        condition: service_started
      orthanc:
        condition: service_started
    restart: "no"

  orthanc:
    image: orthancteam/orthanc:26.9.1
    container_name: orthanc
    network_mode: host
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /run/orthanc/plugins:exec   # entrypoint copies enabled plugins here at startup (needs exec to load .so files)
    volumes:
      - ./orthanc.d:/etc/orthanc:ro          # Machine-local Orthanc config (including the timiv modality)
      - ./data/orthanc:/var/lib/orthanc/db   # Orthanc index + DICOM storage
      - ./data/orthanc-export:/export        # Target for REST /export (RestApiWriteToFileSystemEnabled)
      - ./data/orthanc-hostid:/etc/hostid:ro # Fixed hostid for DICOM UID generation (entrypoint would otherwise write /etc/hostid)
    # ORTHANC__FOO_BAR maps to the "FooBar" config key; values are parsed as JSON where possible.
    environment:
      VERBOSE_ENABLED: "true"   # info-level logs to stdout
      ORTHANC__STORAGE_DIRECTORY: /var/lib/orthanc/db
      ORTHANC__INDEX_DIRECTORY: /var/lib/orthanc/db
      ORTHANC__AUTHENTICATION_ENABLED: "false"
      ORTHANC__REMOTE_ACCESS_ALLOWED: "true"
      ORTHANC__DICOM_ALWAYS_ALLOW_ECHO: "true"
      ORTHANC__DICOM_ALWAYS_ALLOW_STORE: "true"
      ORTHANC__DICOM_ALWAYS_ALLOW_FIND: "true"
      ORTHANC__DICOM_ALWAYS_ALLOW_MOVE: "true"
      ORTHANC__DICOM_ALWAYS_ALLOW_GET: "true"
      ORTHANC__DICOM_CHECK_MODALITY_HOST: "false"
      ORTHANC__REST_API_WRITE_TO_FILE_SYSTEM_ENABLED: "true"
      ORTHANC__DICOM_MODALITIES: |
        { "RCONNECT_SCP": ["RCONNECT_SCP", "localhost", 4104] }

  caddy:
    image: caddy:latest
    container_name: caddy-proxy
    network_mode: host
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

configs:
  caddyfile:
    # Compose interpolates $VARS here; escape a literal $ as $$. Caddy's {placeholders} are untouched.
    content: |
      {
          # Override standard HTTP/HTTPS listening ports to high ports (>1024)
          http_port 8080
          https_port 8443
      }

      https://localhost:8443 {
          reverse_proxy 127.0.0.1:5000 {
              header_up Host {host}
              header_up X-Real-IP {remote}
              header_up X-Forwarded-For {remote}
              header_up X-Forwarded-Proto {scheme}
          }
      }

volumes:
  caddy_data:
  caddy_config:
